<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>니모의 물방울 탈출</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #0b1d3a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: linear-gradient(180deg, #1cb5e0 0%, #000851 100%);
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let GAME_WIDTH = 400;
  let GAME_HEIGHT = 700;
  let isLandscape = false;

  function updateDimensions() {
    isLandscape = window.innerWidth > window.innerHeight;
    if (isLandscape) {
      canvas.width = 800;
      canvas.height = 450;
    } else {
      canvas.width = 400;
      canvas.height = 700;
    }
    GAME_WIDTH = canvas.width;
    GAME_HEIGHT = canvas.height;
  }

  window.addEventListener('resize', updateDimensions);
  window.addEventListener('orientationchange', () => {
    setTimeout(updateDimensions, 100);
  });
  updateDimensions();

  let gameState = 'START';
  let score = 0;
  let highScore = localStorage.getItem('nemo_highscore') || 0;
  let frames = 0;
  let levelNoticeTimer = 0;
  let lastLevel = 1;

  function enableFullScreen() {
    const docEl = document.documentElement;
    const requestFS = docEl.requestFullscreen || 
                      docEl.webkitRequestFullscreen || 
                      docEl.mozRequestFullScreen || 
                      docEl.msRequestFullscreen;
    if (requestFS && !document.fullscreenElement && !document.webkitFullscreenElement) {
      requestFS.call(docEl).catch(() => {});
    }
  }

  function getLevelInfo(s) {
    const lvl = Math.floor(s / 10) + 1;
    let title = '초급';
    if (lvl === 2) title = '중급';
    else if (lvl === 3) title = '상급';
    else if (lvl >= 4) title = '마스터';
    return { level: lvl, title: title };
  }

  const nemo = {
    x: 80,
    y: GAME_HEIGHT / 2,
    radius: 18,
    hitRadius: 8,
    velocity: 0,
    gravity: 0.15,
    jumpStrength: -3.6,
    angle: 0,

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      const tailWiggle = Math.sin(frames * 0.25) * 4;

      // 꼬리
      ctx.fillStyle = '#ff5722';
      ctx.beginPath();
      ctx.moveTo(-15, 0);
      ctx.lineTo(-28, -12 + tailWiggle);
      ctx.lineTo(-24, 0);
      ctx.lineTo(-28, 12 + tailWiggle);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 몸통
      ctx.fillStyle = '#ff6d00';
      ctx.beginPath();
      ctx.ellipse(0, 0, 22, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 줄무늬 1
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(-4, 0, 4.5, 14.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // 줄무늬 2
      ctx.beginPath();
      ctx.ellipse(7, 0, 4, 15, 0, 0, Math.PI * 2);
      ctx.fill();

      // 눈
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(12, -4, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(14, -4, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(15, -5, 1, 0, Math.PI * 2);
      ctx.fill();

      // 옆지느러미
      ctx.fillStyle = '#ff9100';
      ctx.beginPath();
      ctx.ellipse(1, 4, 6, 4, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    },

    update() {
      this.velocity += this.gravity;
      this.y += this.velocity;

      if (this.velocity < 0) {
        this.angle = Math.max(-0.3, this.velocity * 0.06);
      } else {
        this.angle = Math.min(0.4, this.velocity * 0.05);
      }

      if (this.y + this.hitRadius > GAME_HEIGHT) {
        this.y = GAME_HEIGHT - this.hitRadius;
        gameOver();
      }
      if (this.y - this.hitRadius < 0) {
        this.y = this.hitRadius;
        this.velocity = 0;
      }
    },

    flap() {
      this.velocity = this.jumpStrength;
    },

    reset() {
      this.y = GAME_HEIGHT / 2;
      this.velocity = 0;
      this.angle = 0;
    }
  };

  const obstacles = [];

  class ObstacleColumn {
    constructor(level) {
      this.x = GAME_WIDTH + 20;
      this.speedX = (isLandscape ? 1.1 : 0.85) + level * 0.15;
      this.passed = false;
      
      const baseGap = isLandscape ? 170 : 242;
      this.gapSize = Math.max(isLandscape ? 125 : 180, baseGap - level * 12);
      
      const minY = 40;
      const maxY = GAME_HEIGHT - this.gapSize - 40;
      this.gapY = Math.random() * Math.max(20, (maxY - minY)) + minY;

      this.bubbles = [];
      for (let i = 0; i < 18; i++) {
        const isUpper = Math.random() < 0.5;
        const by = isUpper 
          ? Math.random() * this.gapY 
          : this.gapY + this.gapSize + Math.random() * (GAME_HEIGHT - (this.gapY + this.gapSize));
        this.bubbles.push({
          relX: (Math.random() - 0.5) * 36,
          y: by,
          r: Math.random() * 8 + 6,
          speed: Math.random() * 1.2 + 0.8
        });
      }
    }

    update() {
      this.x -= this.speedX;
      this.bubbles.forEach(b => {
        b.y -= b.speed;
        if (b.y < 0) b.y = GAME_HEIGHT;
      });
    }

    draw() {
      ctx.save();
      this.drawBubbleStream(0, this.gapY);
      this.drawBubbleStream(this.gapY + this.gapSize, GAME_HEIGHT);

      this.bubbles.forEach(b => {
        ctx.beginPath();
        ctx.arc(this.x + b.relX, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.x + b.relX - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.fill();
      });

      ctx.restore();
    }

    drawBubbleStream(top, bottom) {
      if (bottom <= top) return;
      const height = bottom - top;
      
      const grad = ctx.createLinearGradient(this.x - 20, 0, this.x + 20, 0);
      grad.addColorStop(0, 'rgba(100, 200, 255, 0.05)');
      grad.addColorStop(0.5, 'rgba(180, 240, 255, 0.35)');
      grad.addColorStop(1, 'rgba(100, 200, 255, 0.05)');

      ctx.fillStyle = grad;
      ctx.fillRect(this.x - 22, top, 44, height);

      ctx.strokeStyle = 'rgba(200, 240, 255, 0.3)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(this.x - 20, top);
      ctx.lineTo(this.x - 20, bottom);
      ctx.moveTo(this.x + 20, top);
      ctx.lineTo(this.x + 20, bottom);
      ctx.stroke();
    }

    hits(fish) {
      const hr = fish.hitRadius || fish.radius;
      if (fish.x + hr > this.x - 18 && fish.x - hr < this.x + 18) {
        if (fish.y - hr < this.gapY || fish.y + hr > this.gapY + this.gapSize) {
          return true;
        }
      }
      return false;
    }
  }

  const bgParticles = Array.from({ length: 30 }, () => ({
    x: Math.random() * 800,
    y: Math.random() * 700,
    r: Math.random() * 3 + 1,
    speed: Math.random() * 0.8 + 0.3
  }));

  function updateBackground() {
    bgParticles.forEach(p => {
      p.y -= p.speed;
      if (p.y < 0) {
        p.y = GAME_HEIGHT;
        p.x = Math.random() * GAME_WIDTH;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fill();
    });
  }

  function handleAction() {
    enableFullScreen();
    if (gameState === 'START') {
      gameState = 'PLAYING';
      nemo.flap();
    } else if (gameState === 'PLAYING') {
      nemo.flap();
    } else if (gameState === 'GAMEOVER') {
      obstacles.length = 0;
      score = 0;
      frames = 0;
      lastLevel = 1;
      levelNoticeTimer = 0;
      nemo.reset();
      gameState = 'PLAYING';
      nemo.flap();
    }
  }

  window.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleAction();
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      handleAction();
    }
  });

  function gameOver() {
    gameState = 'GAMEOVER';
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('nemo_highscore', highScore);
    }
  }

  function loop() {
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    updateBackground();

    const lvlInfo = getLevelInfo(score);

    if (gameState === 'START') {
      nemo.draw();
      drawUIStart();
    } else if (gameState === 'PLAYING') {
      frames++;

      const obstacleSpacing = Math.max(140, Math.floor((isLandscape ? 210 : 230) - lvlInfo.level * 10));

      if (frames % obstacleSpacing === 0) {
        obstacles.push(new ObstacleColumn(lvlInfo.level));
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const ob = obstacles[i];
        ob.update();
        ob.draw();

        if (ob.hits(nemo)) {
          gameOver();
        }

        if (!ob.passed && ob.x < nemo.x) {
          ob.passed = true;
          score++;

          const newLvlInfo = getLevelInfo(score);
          if (newLvlInfo.level > lastLevel) {
            lastLevel = newLvlInfo.level;
            levelNoticeTimer = 90;
          }
        }

        if (ob.x < -40) {
          obstacles.splice(i, 1);
        }
      }

      nemo.update();
      nemo.draw();
      drawScore(lvlInfo);
      drawLevelNotice(lvlInfo);

    } else if (gameState === 'GAMEOVER') {
      obstacles.forEach(ob => ob.draw());
      nemo.draw();
      drawUIGameOver(lvlInfo);
    }

    requestAnimationFrame(loop);
  }

  function drawScore(lvlInfo) {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 38px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 6;
    ctx.fillText(score, GAME_WIDTH / 2, isLandscape ? 50 : 70);

    ctx.font = 'bold 16px sans-serif';
    ctx.fillStyle = '#ffca28';
    ctx.fillText(`LV.${lvlInfo.level} [${lvlInfo.title}]`, GAME_WIDTH / 2, isLandscape ? 75 : 100);
    ctx.shadowBlur = 0;
  }

  function drawLevelNotice(lvlInfo) {
    if (levelNoticeTimer > 0) {
      levelNoticeTimer--;
      const alpha = Math.min(1, levelNoticeTimer / 30);
      ctx.save();
      ctx.globalAlpha = alpha;

      ctx.fillStyle = 'rgba(255, 193, 7, 0.25)';
      ctx.fillRect(0, GAME_HEIGHT / 2 - 40, GAME_WIDTH, 70);

      ctx.fillStyle = '#ffeb3b';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 8;
      ctx.fillText(`LEVEL UP! LV.${lvlInfo.level} [${lvlInfo.title}]`, GAME_WIDTH / 2, GAME_HEIGHT / 2);
      ctx.font = '14px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`속도가 살짝 상승합니다!`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 22);

      ctx.restore();
    }
  }

  function drawUIStart() {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 30px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText("니모의 버블 탈출", GAME_WIDTH / 2, GAME_HEIGHT / 2 - (isLandscape ? 60 : 90));

    ctx.font = '16px sans-serif';
    ctx.fillStyle = '#ffca28';
    ctx.fillText("화면을 터치해서 시작하세요!", GAME_WIDTH / 2, GAME_HEIGHT / 2 - (isLandscape ? 25 : 50));

    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.font = '14px sans-serif';
    ctx.fillText("📱 터치 시 주소창 자동 숨김 & 몰입 전체화면 전환", GAME_WIDTH / 2, GAME_HEIGHT / 2 + (isLandscape ? 50 : 80));

    ctx.fillStyle = 'rgba(200, 230, 255, 0.75)';
    ctx.font = '13px sans-serif';
    ctx.fillText("스마트폰을 가로로 돌리면 와이드 전체화면으로 즐길 수 있습니다", GAME_WIDTH / 2, GAME_HEIGHT / 2 + (isLandscape ? 75 : 105));
  }

  function drawUIGameOver(lvlInfo) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    ctx.fillStyle = '#ff5252';
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText("GAME OVER", GAME_WIDTH / 2, GAME_HEIGHT / 2 - (isLandscape ? 45 : 60));

    ctx.fillStyle = '#ffffff';
    ctx.font = '20px sans-serif';
    ctx.fillText(`최종 점수: ${score} (LV.${lvlInfo.level} ${lvlInfo.title})`, GAME_WIDTH / 2, GAME_HEIGHT / 2 - 5);
    ctx.fillText(`최고 기록: ${highScore}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 25);

    ctx.fillStyle = '#ffeb3b';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText("화면을 터치하여 다시 시작", GAME_WIDTH / 2, GAME_HEIGHT / 2 + (isLandscape ? 65 : 85));
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
