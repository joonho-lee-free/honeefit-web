<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>허니핏 아케이드 - 미니게임 포털</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #0b1d3a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* 포털 메인 화면 스타일 */
    #portal-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
      overflow-y: auto;
      background: radial-gradient(circle at center top, #1a3a68 0%, #0b1d3a 80%);
    }

    .portal-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .portal-title {
      font-size: 28px;
      font-weight: 800;
      color: #4fc3f7;
      text-shadow: 0 2px 12px rgba(79, 195, 247, 0.4);
      margin-bottom: 6px;
    }

    .portal-subtitle {
      font-size: 14px;
      color: #b0bec5;
    }

    .game-grid {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
      padding-bottom: 30px;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
    }

    .game-card:hover, .game-card:active {
      transform: translateY(-4px) scale(1.02);
      border-color: #ffb74d;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 24px rgba(255, 183, 77, 0.3);
    }

    .game-icon-wrapper {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: linear-gradient(135deg, #ff7043 0%, #ff9800 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(255, 112, 67, 0.4);
    }

    .game-name {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .game-tag {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.15);
      padding: 3px 8px;
      border-radius: 10px;
      color: #ffecb3;
      margin-bottom: 12px;
    }

    .game-play-btn {
      width: 100%;
      padding: 9px 0;
      background: #ff9800;
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      border-radius: 12px;
      border: none;
      box-shadow: 0 3px 8px rgba(255, 152, 0, 0.4);
      pointer-events: none;
    }

    /* 준비중 카드 */
    .game-card.disabled {
      opacity: 0.5;
      cursor: default;
    }

    .game-card.disabled:hover, .game-card.disabled:active {
      transform: none;
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }

    .disabled .game-icon-wrapper {
      background: linear-gradient(135deg, #546e7a 0%, #37474f 100%);
      box-shadow: none;
    }

    .disabled .game-play-btn {
      background: #546e7a;
      box-shadow: none;
    }

    /* 게임 캔버스 화면 Container */
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: none;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: linear-gradient(180deg, #1cb5e0 0%, #000851 100%);
    }

    #back-home-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    #back-home-btn:active {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

<!-- 아케이드 메인 포털 -->
<div id="portal-container">
  <div class="portal-header">
    <div class="portal-title">🎮 허니핏 아케이드</div>
    <div class="portal-subtitle">원하는 미니게임을 선택해 플레이하세요!</div>
  </div>

  <div class="game-grid">
    <!-- 니모 탈출 카드 아이콘 -->
    <div class="game-card" onclick="launchGame('nemo')">
      <div class="game-icon-wrapper">🐠</div>
      <div class="game-name">니모 탈출</div>
      <div class="game-tag">5점 레벨업 & 5단계 가속</div>
      <button class="game-play-btn">게임 시작 ▶</button>
    </div>

    <!-- 예정 게임 1 -->
    <div class="game-card disabled">
      <div class="game-icon-wrapper">🧩</div>
      <div class="game-name">퍼즐 블록</div>
      <div class="game-tag">COMING SOON</div>
      <button class="game-play-btn">준비 중</button>
    </div>

    <!-- 예정 게임 2 -->
    <div class="game-card disabled">
      <div class="game-icon-wrapper">🚀</div>
      <div class="game-name">우주 슈팅</div>
      <div class="game-tag">COMING SOON</div>
      <button class="game-play-btn">준비 중</button>
    </div>
  </div>
</div>

<!-- 게임 실행 화면 -->
<div id="game-container">
  <button id="back-home-btn" onclick="exitToMenu(event)">🏠 메뉴로</button>
  <canvas id="gameCanvas"></canvas>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let GAME_WIDTH = 400;
  let GAME_HEIGHT = 700;
  let isLandscape = false;
  let currentAppMode = 'MENU'; // 'MENU' or 'GAME'

  function updateDimensions() {
    isLandscape = window.innerWidth > window.innerHeight;
    if (isLandscape) {
      canvas.width = 800;
      canvas.height = 450;
    } else {
      canvas.width = 400;
      canvas.height = 700;
    }
    GAME_WIDTH = canvas.width;
    GAME_HEIGHT = canvas.height;

    if (nemo) {
      nemo.x = isLandscape ? 120 : 90;
      if (gameState === 'START' || gameState === 'MENU') {
        nemo.y = GAME_HEIGHT / 2;
      }
    }
  }

  window.addEventListener('resize', updateDimensions);
  window.addEventListener('orientationchange', () => {
    setTimeout(updateDimensions, 100);
  });
  updateDimensions();

  function enableFullScreen() {
    const docEl = document.documentElement;
    const requestFS = docEl.requestFullscreen || 
                      docEl.webkitRequestFullscreen || 
                      docEl.mozRequestFullScreen || 
                      docEl.msRequestFullscreen;
    if (requestFS && !document.fullscreenElement && !document.webkitFullscreenElement) {
      requestFS.call(docEl).catch(() => {});
    }
  }

  function launchGame(gameId) {
    if (gameId === 'nemo') {
      currentAppMode = 'GAME';
      document.getElementById('portal-container').style.display = 'none';
      document.getElementById('game-container').style.display = 'flex';
      
      enableFullScreen();
      updateDimensions();

      // 니모 게임 완전 리셋
      obstacles.length = 0;
      score = 0;
      frames = 0;
      lastLevel = 1;
      levelNoticeTimer = 0;
      nemo.reset();
      gameState = 'START';
    }
  }

  function exitToMenu(e) {
    if (e) e.stopPropagation();
    currentAppMode = 'MENU';
    gameState = 'MENU';
    document.getElementById('game-container').style.display = 'none';
    document.getElementById('portal-container').style.display = 'flex';
  }

  let gameState = 'MENU';
  let score = 0;
  let highScore = localStorage.getItem('nemo_highscore') || 0;
  let frames = 0;
  let levelNoticeTimer = 0;
  let lastLevel = 1;

  function getLevelInfo(s) {
    const lvl = Math.floor(s / 5) + 1;
    const tier = Math.floor((lvl - 1) / 5);
    let title = `LV.${lvl}`;
    if (tier === 0) title = `LV.${lvl} (초급)`;
    else if (tier === 1) title = `LV.${lvl} (중급)`;
    else if (tier === 2) title = `LV.${lvl} (상급)`;
    else title = `LV.${lvl} (마스터)`;
    return { level: lvl, tier: tier, title: title };
  }

  const nemo = {
    x: 90,
    y: 350,
    radius: 18,
    hitRadius: 10,
    velocity: 0,
    gravity: 0.18,
    jumpStrength: -4.0,
    angle: 0,

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      const tailWiggle = Math.sin(frames * 0.3) * 5;

      // 선명한 황금색 후광 그림자 효과
      ctx.shadowColor = 'rgba(255, 235, 59, 0.7)';
      ctx.shadowBlur = 10;

      // 꼬리
      ctx.fillStyle = '#ff5722';
      ctx.beginPath();
      ctx.moveTo(-15, 0);
      ctx.lineTo(-28, -12 + tailWiggle);
      ctx.lineTo(-24, 0);
      ctx.lineTo(-28, 12 + tailWiggle);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // 몸통
      ctx.fillStyle = '#ff6d00';
      ctx.beginPath();
      ctx.ellipse(0, 0, 22, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 줄무늬 1
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(-4, 0, 4.5, 14.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 줄무늬 2
      ctx.beginPath();
      ctx.ellipse(7, 0, 4, 15, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 눈
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(12, -4, 5.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(14, -4, 2.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(15, -5, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // 옆지느러미
      ctx.fillStyle = '#ff9100';
      ctx.beginPath();
      ctx.ellipse(1, 4, 6, 4, 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    },

    update() {
      // 대기(START) 상태에서는 중앙에서 귀엽게 둥실둥실 유영 연출
      if (gameState === 'START') {
        this.y = (GAME_HEIGHT / 2) + Math.sin(frames * 0.08) * 8;
        this.velocity = 0;
        this.angle = 0;
        return;
      }

      this.velocity += this.gravity;
      this.y += this.velocity;

      if (this.velocity < 0) {
        this.angle = Math.max(-0.35, this.velocity * 0.07);
      } else {
        this.angle = Math.min(0.45, this.velocity * 0.05);
      }

      if (this.y + this.hitRadius > GAME_HEIGHT) {
        this.y = GAME_HEIGHT - this.hitRadius;
        gameOver();
      }
      if (this.y - this.hitRadius < 0) {
        this.y = this.hitRadius;
        this.velocity = 0;
      }
    },

    flap() {
      this.velocity = this.jumpStrength;
    },

    reset() {
      this.x = isLandscape ? 120 : 90;
      this.y = GAME_HEIGHT / 2;
      this.velocity = 0;
      this.angle = 0;
    }
  };

  const obstacles = [];

  class ObstacleColumn {
    constructor(level) {
      this.x = GAME_WIDTH + 20;
      this.passed = false;
      
      const tier = Math.floor((level - 1) / 5);
      
      const baseGap = isLandscape ? 165 : 225;
      const gapDecrease = tier * 10;
      this.gapSize = Math.max(isLandscape ? 115 : 155, baseGap - gapDecrease);
      
      const minY = 40;
      const maxY = GAME_HEIGHT - this.gapSize - 40;
      this.gapY = Math.random() * Math.max(20, (maxY - minY)) + minY;

      this.bubbles = [];
      for (let i = 0; i < 18; i++) {
        const isUpper = Math.random() < 0.5;
        const by = isUpper 
          ? Math.random() * this.gapY 
          : this.gapY + this.gapSize + Math.random() * (GAME_HEIGHT - (this.gapY + this.gapSize));
        this.bubbles.push({
          relX: (Math.random() - 0.5) * 36,
          y: by,
          r: Math.random() * 8 + 6,
          speed: Math.random() * 1.4 + 1.0
        });
      }
    }

    update(speedX) {
      this.x -= speedX;
      this.bubbles.forEach(b => {
        b.y -= b.speed;
        if (b.y < 0) b.y = GAME_HEIGHT;
      });
    }

    draw() {
      ctx.save();
      this.drawBubbleStream(0, this.gapY);
      this.drawBubbleStream(this.gapY + this.gapSize, GAME_HEIGHT);

      this.bubbles.forEach(b => {
        ctx.beginPath();
        ctx.arc(this.x + b.relX, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.x + b.relX - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.fill();
      });

      ctx.restore();
    }

    drawBubbleStream(top, bottom) {
      if (bottom <= top) return;
      const height = bottom - top;
      
      const grad = ctx.createLinearGradient(this.x - 20, 0, this.x + 20, 0);
      grad.addColorStop(0, 'rgba(100, 200, 255, 0.05)');
      grad.addColorStop(0.5, 'rgba(180, 240, 255, 0.35)');
      grad.addColorStop(1, 'rgba(100, 200, 255, 0.05)');

      ctx.fillStyle = grad;
      ctx.fillRect(this.x - 22, top, 44, height);

      ctx.strokeStyle = 'rgba(200, 240, 255, 0.3)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(this.x - 20, top);
      ctx.lineTo(this.x - 20, bottom);
      ctx.moveTo(this.x + 20, top);
      ctx.lineTo(this.x + 20, bottom);
      ctx.stroke();
    }

    hits(fish) {
      const hr = fish.hitRadius || fish.radius;
      if (fish.x + hr > this.x - 18 && fish.x - hr < this.x + 18) {
        if (fish.y - hr < this.gapY || fish.y + hr > this.gapY + this.gapSize) {
          return true;
        }
      }
      return false;
    }
  }

  const bgParticles = Array.from({ length: 30 }, () => ({
    x: Math.random() * 800,
    y: Math.random() * 700,
    r: Math.random() * 3 + 1,
    speed: Math.random() * 0.8 + 0.3
  }));

  function updateBackground() {
    bgParticles.forEach(p => {
      p.y -= p.speed;
      if (p.y < 0) {
        p.y = GAME_HEIGHT;
        p.x = Math.random() * GAME_WIDTH;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fill();
    });
  }

  function handleAction(e) {
    if (e && e.target && e.target.closest('#back-home-btn')) return;
    if (currentAppMode !== 'GAME') return;

    enableFullScreen();
    if (gameState === 'START') {
      gameState = 'PLAYING';
      nemo.flap();
    } else if (gameState === 'PLAYING') {
      nemo.flap();
    } else if (gameState === 'GAMEOVER') {
      obstacles.length = 0;
      score = 0;
      frames = 0;
      lastLevel = 1;
      levelNoticeTimer = 0;
      nemo.reset();
      gameState = 'PLAYING';
      nemo.flap();
    }
  }

  window.addEventListener('pointerdown', (e) => {
    if (currentAppMode === 'GAME') {
      e.preventDefault();
      handleAction(e);
    }
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && currentAppMode === 'GAME') {
      handleAction(e);
    }
  });

  function gameOver() {
    gameState = 'GAMEOVER';
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('nemo_highscore', highScore);
    }
  }

  function loop() {
    if (currentAppMode === 'GAME') {
      ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
      updateBackground();

      const lvlInfo = getLevelInfo(score);
      const tier = lvlInfo.tier;

      const speedBoost = tier * 0.5;
      const currentSpeed = (isLandscape ? 1.7 : 1.35) + speedBoost;

      const TARGET_COLUMN_DISTANCE = isLandscape ? 280 : 270;

      if (gameState === 'START') {
        frames++;
        nemo.update();
        nemo.draw();
        drawUIStart();
      } else if (gameState === 'PLAYING') {
        frames++;

        const lastObstacle = obstacles[obstacles.length - 1];
        if (!lastObstacle || (GAME_WIDTH + 20 - lastObstacle.x) >= TARGET_COLUMN_DISTANCE) {
          obstacles.push(new ObstacleColumn(lvlInfo.level));
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const ob = obstacles[i];
          ob.update(currentSpeed);
          ob.draw();

          if (ob.hits(nemo)) {
            gameOver();
          }

          if (!ob.passed && ob.x < nemo.x) {
            ob.passed = true;
            score++;

            const newLvlInfo = getLevelInfo(score);
            if (newLvlInfo.level > lastLevel) {
              lastLevel = newLvlInfo.level;
              levelNoticeTimer = 90;
            }
          }

          if (ob.x < -50) {
            obstacles.splice(i, 1);
          }
        }

        nemo.update();
        nemo.draw();
        drawScore(lvlInfo);
        drawLevelNotice(lvlInfo);

      } else if (gameState === 'GAMEOVER') {
        obstacles.forEach(ob => ob.draw());
        nemo.draw();
        drawUIGameOver(lvlInfo);
      }
    }

    requestAnimationFrame(loop);
  }

  function drawScore(lvlInfo) {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 38px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 6;
    ctx.fillText(score, GAME_WIDTH / 2, isLandscape ? 50 : 70);

    ctx.font = 'bold 16px sans-serif';
    ctx.fillStyle = '#ffca28';
    ctx.fillText(`${lvlInfo.title}`, GAME_WIDTH / 2, isLandscape ? 75 : 100);
    ctx.shadowBlur = 0;
  }

  function drawLevelNotice(lvlInfo) {
    if (levelNoticeTimer > 0) {
      levelNoticeTimer--;
      const alpha = Math.min(1, levelNoticeTimer / 30);
      ctx.save();
      ctx.globalAlpha = alpha;

      ctx.fillStyle = 'rgba(255, 193, 7, 0.25)';
      ctx.fillRect(0, GAME_HEIGHT / 2 - 40, GAME_WIDTH, 70);

      ctx.fillStyle = '#ffeb3b';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 8;

      let subText = "5점 달성! 다음 레벨 진입!";
      if ((lvlInfo.level - 1) % 5 === 0 && lvlInfo.level > 1) {
        subText = "🔥 난이도 가속 구간! (속도 +0.5 & 구멍 -10px)";
      }

      ctx.fillText(`LEVEL UP! ${lvlInfo.title}`, GAME_WIDTH / 2, GAME_HEIGHT / 2);
      ctx.font = '14px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(subText, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 22);

      ctx.restore();
    }
  }

  function drawUIStart() {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 30px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText("니모의 버블 탈출", GAME_WIDTH / 2, GAME_HEIGHT / 2 - (isLandscape ? 60 : 90));

    ctx.font = '16px sans-serif';
    ctx.fillStyle = '#ffca28';
    ctx.fillText("화면을 터치해서 시작하세요!", GAME_WIDTH / 2, GAME_HEIGHT / 2 - (isLandscape ? 25 : 50));

    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.font = '14px sans-serif';
    ctx.fillText("⭐ 5점마다 레벨 UP! (5레벨마다 속도 +0.5 / 구멍 -10px)", GAME_WIDTH / 2, GAME_HEIGHT / 2 + (isLandscape ? 50 : 80));

    ctx.fillStyle = 'rgba(200, 230, 255, 0.75)';
    ctx.font = '13px sans-serif';
    ctx.fillText("기둥 좌우 간격(270px)은 언제나 일정하게 유지됩니다", GAME_WIDTH / 2, GAME_HEIGHT / 2 + (isLandscape ? 75 : 105));
  }

  function drawUIGameOver(lvlInfo) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    ctx.fillStyle = '#ff5252';
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText("GAME OVER", GAME_WIDTH / 2, GAME_HEIGHT / 2 - (isLandscape ? 45 : 60));

    ctx.fillStyle = '#ffffff';
    ctx.font = '20px sans-serif';
    ctx.fillText(`최종 점수: ${score} (${lvlInfo.title})`, GAME_WIDTH / 2, GAME_HEIGHT / 2 - 5);
    ctx.fillText(`최고 기록: ${highScore}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 25);

    ctx.fillStyle = '#ffeb3b';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText("화면을 터치하여 다시 시작", GAME_WIDTH / 2, GAME_HEIGHT / 2 + (isLandscape ? 65 : 85));
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
